[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false

# Disk hygiene (RiftMind's target/ reached 50 GB): line tables for our crates, nothing for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Kernels and their references are timed in tests: unoptimized code would measure the debug build, not the kernel.
[profile.dev.package.fa-asm]
opt-level = 3
